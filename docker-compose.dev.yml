# ============================================================
# go-manus 本地开发环境 (简化版，无需 nginx)
# ============================================================
# 直接访问各服务端口，适合本地开发和调试
# ============================================================

services:
  # ==================== 基础设施 ====================

  postgres:
    image: postgres:16-alpine
    container_name: go-manus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-manus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations/001_create_sessions.sql:/docker-entrypoint-initdb.d/001_create_sessions.sql
      - ./api/migrations/002_create_files.sql:/docker-entrypoint-initdb.d/002_create_files.sql
      - ./api/migrations/003_create_app_configs.sql:/docker-entrypoint-initdb.d/003_create_app_configs.sql
    ports:
      - "5432:5432"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: go-manus-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO 对象存储 ====================

  minio:
    image: minio/minio:latest
    container_name: go-manus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API 端口（程序使用）
      - "9001:9001"   # 控制台端口（浏览器访问）
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Go API 服务 ====================

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: go-manus-api:latest
    container_name: go-manus-api
    restart: unless-stopped
    env_file:
      - ./api/.env.example
    environment:
      # 数据库配置
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_DATABASE=${POSTGRES_DB:-manus}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # COS 配置 (按需填入)
      - COS_SECRET_ID=${COS_SECRET_ID:-minioadmin}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-minioadmin}
      - COS_REGION=${COS_REGION:-us-east-1}
      - COS_BUCKET=${COS_BUCKET:-go-manus-files}
      # MinIO 特殊配置（用于 S3 兼容 SDK）
      - COS_ENDPOINT=${COS_ENDPOINT:-http://minio:9000}
      # 沙箱服务配置
      - SANDBOX_ADDRESS=http://sandbox:8080
      # LLM 配置 (按需填入)
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4}
      # 服务配置
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - go-manus-network
    # volumes:
    #   - ./api:/app  # 挂载源码，支持热更新 (可选)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ==================== 沙箱服务 ====================

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: go-manus-sandbox:latest
    container_name: go-manus-sandbox
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - go-manus-network
    ports:
      - "8090:8080"

  # ==================== 前端 UI ====================

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # 本地开发直接调用 API 端口
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    image: go-manus-ui:latest
    container_name: go-manus-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== 网络和存储 ====================

networks:
  go-manus-network:
    name: go-manus-network
    driver: bridge

volumes:
  postgres_data:
    name: go-manus-postgres-data
  redis_data:
    name: go-manus-redis-data
  minio_data:
    name: go-manus-minio-data