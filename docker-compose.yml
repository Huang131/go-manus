# ============================================================
# go-manus 完整服务编排
# ============================================================
# 包含: API (Go) + 沙箱服务 (Python) + 前端 (Next.js) + 基础设施
# ============================================================

services:
  # ==================== 基础设施 ====================

  postgres:
    image: postgres:16-alpine
    container_name: go-manus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-manus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 数据库初始化脚本
      - ./api/migrations/001_create_sessions.sql:/docker-entrypoint-initdb.d/001_create_sessions.sql
      - ./api/migrations/002_create_files.sql:/docker-entrypoint-initdb.d/002_create_files.sql
      - ./api/migrations/003_create_app_configs.sql:/docker-entrypoint-initdb.d/003_create_app_configs.sql
      - ./api/migrations/004_create_llm_models.sql:/docker-entrypoint-initdb.d/004_create_llm_models.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: go-manus-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO 对象存储 ====================

  minio:
    image: minio/minio:latest
    container_name: go-manus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API 端口（程序使用）
      - "9001:9001"   # 控制台端口（浏览器访问）
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Go API 服务 ====================

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: go-manus-api:latest
    container_name: go-manus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库配置
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_DATABASE=${POSTGRES_DB:-manus}
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # COS 配置 (按需填入)
      - COS_ENDPOINT=http://minio:9000
      - COS_SECRET_ID=${COS_SECRET_ID:-minioadmin}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-minioadmin}
      - COS_REGION=${COS_REGION:-us-east-1}
      - COS_BUCKET=${COS_BUCKET:-go-manus-files}
      # 沙箱服务配置
      - SANDBOX_ADDRESS=http://sandbox:8080
      # LLM 配置 (按需填入)
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4}
      - LLM_TOOL_CALL_TIMEOUT=${LLM_TOOL_CALL_TIMEOUT:-15}
      # 服务配置
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox:
        condition: service_started
    volumes:
      # 挂载 config.docker.yaml 用于覆盖配置（Docker 环境专用）
      - ./api/config.docker.yaml:/app/config.yaml:ro
    command: ["./go-manus", "-config", "/app/config.yaml"]
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - go-manus-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ==================== 沙箱服务 ====================

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: go-manus-sandbox:latest
    container_name: go-manus-sandbox
    restart: unless-stopped
    privileged: true  # 需要特权模式以运行 Docker in Docker
    volumes:
      # 挂载 Docker Socket 以支持动态创建沙箱容器
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - go-manus-network
    ports:
      - "${SANDBOX_PORT:-8090}:8080"

  # ==================== 前端 UI ====================

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # 默认走 nginx 反代模式：相对路径 /api 会被拼到当前 origin（http://localhost:8088）。
        # nginx 的 location /api/ 会反代到 api:8080。
        # 如果删了 nginx 容器，改为绝对地址 http://localhost:8080/api（依赖 CORS）。
        NEXT_PUBLIC_API_BASE_URL: /api
    image: go-manus-ui:latest
    container_name: go-manus-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - go-manus-network
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Nginx 网关 ====================

  nginx:
    image: nginx:alpine
    container_name: go-manus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      # 如需启用 HTTPS，取消以下注释
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书挂载（如需启用 HTTPS）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - go-manus-network

# ==================== 网络和存储 ====================

networks:
  go-manus-network:
    name: go-manus-network
    driver: bridge

volumes:
  postgres_data:
    name: go-manus-postgres-data
  redis_data:
    name: go-manus-redis-data
  minio_data:
    name: go-manus-minio-data