env: development
app_config_filepath: config.yaml

# 日志配置：filename 为空时只输出到 stdout。
# 想要文件切割就填 filename 并调整 max_size / max_age。
log:
  level: info
  filename: ""
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: manus
  max_open_conns: 25
  max_idle_conns: 10

redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

oss:
  provider: tencent  # aws / tencent / volcengine / minio / custom
  endpoint: ""       # 留空则根据 provider 自动推断
  secret_id: ""
  secret_key: ""
  region: ap-guangzhou
  bucket: ""

sandbox:
  address: ""
  http_timeout: 60
  image: ""
  name_prefix: manus
  ttl_minutes: 60
  network: ""
  chrome_args: ""
  https_proxy: ""
  http_proxy: ""
  no_proxy: ""

llm:
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model_name: "gpt-4o"
  temperature: 0.7
  max_tokens: 4096

search:
  provider: "bing"
  http_timeout: 30
  bing_api_key: ""
  google_api_key: ""
  search_engine_id: ""

mcp:
  timeout: 60
  servers:
    # - name: "filesystem"
    #   command: "npx"
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    # - name: "memory"
    #   command: "npx"
    #   args: ["-y", "@modelcontextprotocol/server-memory"]

a2a:
  timeout: 30
  agents:
    # - name: "planner"
    #   url: "http://localhost:8081"
    #   metadata:
    #     description: "任务规划助手"

server:
  host: 0.0.0.0
  port: 8080
  # 受信反向代理列表：nginx 在 docker compose 网络里通常是 172.18.0.0/16，
  # 也可填具体 IP/CIDR。留空时回退到 ["127.0.0.1", "::1"]。
  trusted_proxies:
    - 172.18.0.0/16
    - 127.0.0.1
    - ::1
  read_timeout_sec: 30
  write_timeout_sec: 0   # 流式接口不设置写超时
  idle_timeout_sec: 60
  shutdown_timeout_sec: 30

# 文件清理配置：定期清理过期的临时文件，节省存储成本
# 清理策略：只清理孤立文件（无关联会话或关联会话已删除的文件）
# - 无 session_id 的文件：如临时上传
# - session.deleted_at IS NOT NULL：关联的会话已被软删除
# 不会清理关联活跃会话的文件，保证"会话文件与会话同寿命"
file_cleanup:
  expires_after: "168h" # 文件过期时间，默认 7 天（168h）
  batch_size: 100       # 每批清理的文件数量
  interval: 3600        # 清理间隔（秒），默认 1 小时
