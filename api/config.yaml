env: development
log_level: info
app_config_filepath: config.yaml

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: manus
  max_open_conns: 25
  max_idle_conns: 10

redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

cos:
  secret_id: ""
  secret_key: ""
  region: ap-guangzhou
  scheme: https
  bucket: ""
  domain: ""

