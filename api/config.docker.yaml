env: development
app_config_filepath: config.yaml

# Docker 环境日志：默认只输出到 stdout，由 docker logs 收集。
# 如需落盘可设置 filename=/var/log/manus/server.log。
log:
  level: info
  filename: ""
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

database:
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  database: manus
  max_open_conns: 25
  max_idle_conns: 10

redis:
  host: redis
  port: 6379
  db: 0
  password: ""

oss:
  provider: minio
  endpoint: http://minio:9000
  secret_id: minioadmin
  secret_key: minioadmin
  region: us-east-1
  bucket: go-manus-files

sandbox:
  address: http://sandbox:8080
  image: ""
  name_prefix: manus
  ttl_minutes: 60
  network: ""
  chrome_args: ""
  https_proxy: ""
  http_proxy: ""
  no_proxy: ""

# LLM 配置：实际值由 .env 通过环境变量覆盖（env 优先级 > yaml）
# 这里的 base_url/model_name 仅作占位，最终生效值见根目录 .env
llm:
  base_url: "https://api.gmi-serving.com/v1"
  api_key: ""
  model_name: "MiniMaxAI/MiniMax-M2.7"
  temperature: 0.7
  max_tokens: 4096
  tool_call_timeout: 15

search:
  provider: "bing"
  bing_api_key: ""
  google_api_key: ""
  search_engine_id: ""

mcp:
  timeout: 60
  servers: []

a2a:
  timeout: 30
  agents: []

server:
  host: 0.0.0.0
  port: 8080
  # Docker Compose 网络地址段，与 Nginx/网关通信需要信任此网段
  trusted_proxies:
    - 172.18.0.0/16
    - 127.0.0.1
    - ::1
  read_timeout_sec: 30
  write_timeout_sec: 0    # 流式接口不设置写超时
  idle_timeout_sec: 60
  shutdown_timeout_sec: 30

# 文件清理配置：定期清理过期的临时文件
file_cleanup:
  expires_after: "168h"   # 文件过期时间，默认 7 天
  batch_size: 100         # 每批清理的文件数量
  interval: 3600          # 清理间隔（秒），默认 1 小时